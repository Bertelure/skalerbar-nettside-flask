{% extends "base.html" %}

{% block title %}Dashboard - Min Bedrift{% endblock %}

{% block content %}
<section class="dashboard">
    <h2>Willkommen, {{ session.get('username') }}! 👋</h2>
    
    <div class="dashboard-grid">
        <div class="dashboard-card">
            <h3>Din data</h3>
            <p>Her kan du administrere din lagret data</p>
            <div id="user-data-container">
                <p>Laster...</p>
            </div>
            <button onclick="loadUserData()" class="btn btn-secondary">Oppdater</button>
        </div>
        
        <div class="dashboard-card">
            <h3>Lagre data</h3>
            <form id="data-form">
                <div class="form-group">
                    <label for="data-key">Nøkkel:</label>
                    <input type="text" id="data-key" placeholder="f.eks. 'telefon'" required>
                </div>
                <div class="form-group">
                    <label for="data-value">Verdi:</label>
                    <input type="text" id="data-value" placeholder="f.eks. '+47 12345678'" required>
                </div>
                <button type="submit" class="btn btn-primary">Lagre</button>
            </form>
        </div>
    </div>
</section>

<script>
// Last brukerdata ved innlasting
window.addEventListener('load', loadUserData);

function loadUserData() {
    fetch('/api/data')
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('user-data-container');
            if (Object.keys(data).length === 0) {
                container.innerHTML = '<p>Ingen data lagret ennå</p>';
            } else {
                let html = '<ul>';
                for (let key in data) {
                    html += `<li><strong>${key}:</strong> ${data[key]} 
                        <button onclick="deleteData('${key}')" class="btn-delete">Slett</button>
                    </li>`;
                }
                html += '</ul>';
                container.innerHTML = html;
            }
        })
        .catch(error => console.error('Error:', error));
}

document.getElementById('data-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const key = document.getElementById('data-key').value;
    const value = document.getElementById('data-value').value;
    
    fetch(`/api/data/${key}`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({value: value})
    })
    .then(response => response.json())
    .then(data => {
        alert('Data lagret!');
        loadUserData();
        this.reset();
    })
    .catch(error => console.error('Error:', error));
});

function deleteData(key) {
    if (confirm(`Slett '${key}'?`)) {
        fetch(`/api/data/${key}`, {method: 'DELETE'})
            .then(response => response.json())
            .then(data => {
                alert('Data slettet!');
                loadUserData();
            })
            .catch(error => console.error('Error:', error));
    }
}
</script>
{% endblock %}
